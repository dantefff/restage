# restage distribution catalog
#
# Format: <distro>.<field>=<value>
# Comments start with '#'. Whitespace inside values is significant only in
# quoted lists of versions/codenames/archmap.
#
# Fields:
#   versions    space-separated supported versions
#   default     version used when none is given (first entry if unset)
#   min_ram     minimum RAM in MiB
#   min_disk    minimum free disk in MiB
#   installer   cloud | alpine_live | manual | netboot
#   cloud       cloud-image URL template (installer=cloud)
#   codenames   "ver=codename ..." (needed when URLs use codenames)
#   archmap     "x86_64=amd64 aarch64=arm64" (cloud-image arch naming)
#   kernel      boot kernel URL (installer=manual/netboot)
#   initrd      boot initrd URL (installer=manual/netboot)
#   kernel_args extra cmdline passed to the installer kernel
#
# URL templates: {ver} {arch} {carch} {codename}
#
# NOTE: distros marked "core" are exercised by the test suite and CI; others
# rely on upstream URL patterns that may change and are community-maintained
# (see CONTRIBUTING.md — URL drift reports are welcome).

# ------------------------------------------------------------------ Alpine --
alpine.versions=3.21 3.22
alpine.default=3.22
alpine.min_ram=256
alpine.min_disk=1024
alpine.installer=alpine_live
alpine.kernel_args=modules=loop,squashfs,sd-mod,usb-storage quiet

# ------------------------------------------------------------------ Debian --
debian.versions=10 11 12 13
debian.default=12
debian.min_ram=256
debian.min_disk=2048
debian.installer=cloud
debian.archmap=x86_64=amd64 aarch64=arm64
debian.codenames=10=buster 11=bullseye 12=bookworm 13=trixie
debian.cloud=https://cloud.debian.org/images/cloud/{codename}/latest/debian-{ver}-genericcloud-{carch}.qcow2
debian.kernel_args=

# ------------------------------------------------------------------ Ubuntu --
ubuntu.versions=20.04 22.04 24.04
ubuntu.default=24.04
ubuntu.min_ram=512
ubuntu.min_disk=2048
ubuntu.installer=cloud
ubuntu.archmap=x86_64=amd64 aarch64=arm64
ubuntu.cloud=https://cloud-images.ubuntu.com/releases/{ver}/release/ubuntu-{ver}-server-cloudimg-{carch}.img
ubuntu.kernel_args=

# ------------------------------------------------------------ AlmaLinux ---
almalinux.versions=8 9
almalinux.default=9
almalinux.min_ram=512
almalinux.min_disk=5120
almalinux.installer=cloud
almalinux.archmap=x86_64=x86_64 aarch64=aarch64
almalinux.cloud=https://repo.almalinux.org/almalinux/{ver}/cloud/{carch}/images/AlmaLinux-{ver}-GenericCloud-{carch}.qcow2
almalinux.kernel_args=

# --------------------------------------------------------------- Rocky ---
rocky.versions=8 9
rocky.default=9
rocky.min_ram=512
rocky.min_disk=5120
rocky.installer=cloud
rocky.archmap=x86_64=x86_64 aarch64=aarch64
rocky.cloud=https://download.rockylinux.org/pub/rocky/{ver}/images/{carch}/Rocky-{ver}-GenericCloud-Base.latest.{carch}.qcow2
rocky.kernel_args=

# ------------------------------------------------------------- openEuler ---
openeuler.versions=22.03 24.03
openeuler.default=24.03
openeuler.min_ram=512
openeuler.min_disk=5120
openeuler.installer=cloud
openeuler.archmap=x86_64=x86_64 aarch64=aarch64
openeuler.cloud=https://repo.openeuler.org/openEuler-{ver}/virtual_machine_img/{carch}/openEuler-{ver}-{carch}.qcow2.xz
openeuler.kernel_args=

# -------------------------------------------------------- Extension points --
# The following distros are recognised by the CLI but currently install
# through the generic "manual" path (boot the distro's own netboot assets
# and complete the install by hand in the installer, or via the rescue
# Alpine environment). Their URL templates are placeholders that must be
# filled in by the community before they can be used unattended.
# See CONTRIBUTING.md: "Adding a distribution".

arch.versions=rolling
arch.min_ram=512
arch.min_disk=5120
arch.installer=manual
arch.kernel=https://archlinux.org/static/netboot/arch{ver}-{arch}.kpxe
arch.initrd=
arch.kernel_args=

gentoo.versions=rolling
gentoo.min_ram=512
gentoo.min_disk=5120
gentoo.installer=manual
gentoo.kernel=
gentoo.initrd=
gentoo.kernel_args=
